<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Frais de déplacement | GregPhotographe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a1a1a;
      --orange: #ff6600;
      --orange-light: rgba(255, 102, 0, 0.08);
      --bg: #f4f4f5;
      --card: #ffffff;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--primary);
      padding: 2rem;
      min-height: 100vh;
    }

    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--primary);
    }

    .header h1 span {
      color: var(--orange);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-suffix {
      position: absolute;
      right: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    input[type="number"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s;
      background: #fafafa;
    }

    input[type="number"] {
      padding-right: 30px; /* Space for suffix */
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.5;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--orange);
      background: #fff;
      box-shadow: 0 0 0 3px var(--orange-light);
    }

    .btn-save {
      background: var(--orange);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-save:hover {
      background: #e55c00;
      transform: translateY(-1px);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #10b981;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .header { flex-direction: column; align-items: flex-start; gap: 1rem; }
      body { padding: 1rem; }
    }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="header">
    <h1>Administration <span>Tarifs</span></h1>
    <button class="btn-save" id="saveBtn">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
      Enregistrer les modifications
    </button>
  </div>

  <form id="settingsForm" class="grid">
    
    <div class="card">
      <div class="card-title">📍 Zones Forfaitaires</div>
      
      <div class="form-group">
        <label>Neuilly-sur-Marne (Zone 1)</label>
        <div class="input-wrapper">
          <input type="number" id="priceNeuilly" value="59" />
          <span class="input-suffix">€</span>
        </div>
      </div>

      <div class="form-group">
        <label>Villes limitrophes (Zone 1)</label>
        <div class="input-wrapper">
          <input type="number" id="priceNearby" value="79" />
          <span class="input-suffix">€</span>
        </div>
      </div>

      <div class="form-group">
        <label>Liste des villes limitrophes (séparées par une virgule)</label>
        <textarea id="nearbyCities">Noisy-le-Grand, Chelles, Neuilly-Plaisance, Gagny, Le Perreux-sur-Marne, Gournay-sur-Marne</textarea>
      </div>

      <div class="form-group">
        <label>Paris Intra-muros (Zone 4)</label>
        <div class="input-wrapper">
          <input type="number" id="priceParis" value="150" />
          <span class="input-suffix">€</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🚗 Tarifs Kilométriques (93, 94, 77)</div>
      
      <div class="form-group">
        <label>Zone 2 : Distance maximum</label>
        <div class="input-wrapper">
          <input type="number" id="zone2MaxKm" value="7" />
          <span class="input-suffix">km</span>
        </div>
      </div>

      <div class="form-group">
        <label>Zone 2 : Tarif fixe (≤ distance max)</label>
        <div class="input-wrapper">
          <input type="number" id="priceZone2" value="95" />
          <span class="input-suffix">€</span>
        </div>
      </div>

      <div class="form-group" style="margin-top: 2rem; border-top: 1px dashed #e2e8f0; padding-top: 1rem;">
        <label>Zone 3 : Tarif de base (> distance max)</label>
        <div class="input-wrapper">
          <input type="number" id="priceZone3Base" value="125" />
          <span class="input-suffix">€</span>
        </div>
      </div>

      <div class="form-group">
        <label>Zone 3 : Seuil de facturation supplémentaire</label>
        <div class="input-wrapper">
          <input type="number" id="zone3ExtraThreshold" value="12" />
          <span class="input-suffix">km</span>
        </div>
      </div>

      <div class="form-group">
        <label>Zone 3 : Coût par kilomètre supplémentaire</label>
        <div class="input-wrapper">
          <input type="number" step="0.1" id="pricePerExtraKm" value="3.8" />
          <span class="input-suffix">€</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">✨ Options & Suppléments</div>
      
      <div class="form-group">
        <label>Supplément par Bébé (0-3 mois)</label>
        <div class="input-wrapper">
          <input type="number" id="priceBaby" value="15" />
          <span class="input-suffix">€</span>
        </div>
      </div>

      <div class="form-group">
        <label>Supplément par Photo ANTS</label>
        <div class="input-wrapper">
          <input type="number" id="priceAnts" value="5" />
          <span class="input-suffix">€</span>
        </div>
      </div>
    </div>
<div class="card">
  <div class="card-title">🚗 Zone 4 (91, 92, 78)</div>
  <div class="form-group">
    <label>Tarif de base (≤ 7 km)</label>
    <div class="input-wrapper">
      <input type="number" id="base91" value="150" />
      <span class="input-suffix">€</span>
    </div>
  </div>
  <div class="form-group">
    <label>Tarif étendu (> 7 km)</label>
    <div class="input-wrapper">
      <input type="number" id="long91" value="160" />
      <span class="input-suffix">€</span>
    </div>
  </div>
  <div class="form-group">
    <label>Prix au km (après 10 km)</label>
    <div class="input-wrapper">
      <input type="number" id="kmPrice91" value="4" />
      <span class="input-suffix">€/km</span>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-title">👥 Suppléments</div>
  <div class="form-group">
    <label>Bébé 0-3 mois</label>
    <input type="number" id="priceBaby" value="15" />
  </div>
  <div class="form-group">
    <label>Personne supplémentaire (Adulte/Enfant)</label>
    <input type="number" id="priceExtraPers" value="15" />
  </div>
  <div class="form-group">
    <label>ANTS</label>
    <input type="number" id="priceAnts" value="5" />
  </div>
</div>
  </form>
</div>

<div class="toast" id="toast">✅ Paramètres mis à jour avec succès !</div>

<script>
  // Au chargement, on récupère les données simulées ou existantes
  document.addEventListener('DOMContentLoaded', () => {
    const savedConfig = localStorage.getItem('gregPricingConfig');
    if (savedConfig) {
      const config = JSON.parse(savedConfig);
      for (const [key, value] of Object.entries(config)) {
        const el = document.getElementById(key);
        if (el) el.value = value;
      }
    }
  });

  // Action d'enregistrement
  document.getElementById('saveBtn').addEventListener('click', () => {
    const config = {
      priceNeuilly: Number(document.getElementById('priceNeuilly').value),
      priceNearby: Number(document.getElementById('priceNearby').value),
      nearbyCities: document.getElementById('nearbyCities').value,
      priceParis: Number(document.getElementById('priceParis').value),
      zone2MaxKm: Number(document.getElementById('zone2MaxKm').value),
      priceZone2: Number(document.getElementById('priceZone2').value),
      priceZone3Base: Number(document.getElementById('priceZone3Base').value),
      zone3ExtraThreshold: Number(document.getElementById('zone3ExtraThreshold').value),
      pricePerExtraKm: Number(document.getElementById('pricePerExtraKm').value),
      priceBaby: Number(document.getElementById('priceBaby').value),
      priceAnts: Number(document.getElementById('priceAnts').value)
    };

    // Simulation d'un envoi vers ton API backend (ex: fetch('/api/admin/config', { method: 'POST', body: JSON.stringify(config) }))
    console.log("Configuration prête à être envoyée au serveur :", config);
    
    // Sauvegarde locale pour la démo
    localStorage.setItem('gregPricingConfig', JSON.stringify(config));

    // Afficher la notification
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  });
</script>

</body>
</html>
